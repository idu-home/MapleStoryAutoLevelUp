<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapleStory Auto Bot Debug Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            color: #ffffff;
        }
        
        
        .status-bar {
            padding: 15px;
            background-color: #2a2a2a;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 8px 0;
            border-bottom: 1px solid #444;
        }
        
        .status-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        
        .status-row-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }
        
        .status-row-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ff4444;
            animation: pulse 2s infinite;
        }
        
        .status-dot.connected {
            background-color: #4CAF50;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .image-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: stretch;
        }
        
        .image-panel {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            min-width: 400px;
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            min-height: 500px;
        }
        
        .image-panel h3 {
            margin: 0 0 15px 0;
            color: #4CAF50;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
        }
        
        .image-wrapper {
            position: relative;
            text-align: center;
            background-color: #1a1a1a;
            border-radius: 6px;
            padding: 10px;
            border: 1px solid #444;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 350px;
        }
        
        .debug-image, .route-image {
            max-width: 100%;
            max-height: 100%;
            border-radius: 4px;
            border: 1px solid #555;
            object-fit: contain;
        }
        
        .no-image {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background-color: #333;
            border-radius: 4px;
            color: #888;
            font-style: italic;
            border: 1px dashed #555;
        }
        
        .image-info {
            margin-top: 10px;
            font-size: 12px;
            color: #aaa;
            text-align: center;
            background-color: #2a2a2a;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #444;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
        }
        
        
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .btn:hover {
            background-color: #45a049;
        }
        
        .btn:disabled {
            background-color: #666;
            cursor: not-allowed;
        }
        
        .btn-success {
            background-color: #28a745;
        }
        
        .btn-success:hover {
            background-color: #218838;
        }
        
        .btn-warning {
            background-color: #ffc107;
            color: #212529;
        }
        
        .btn-warning:hover {
            background-color: #e0a800;
            color: #212529;
        }
        
        .fps-counter {
            font-size: 14px;
            color: #888;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            display: flex;
            gap: 15px;
        }
        
        .metric {
            min-width: 80px;
            text-align: left;
        }
        
        .metric-number {
            display: inline-block;
            min-width: 40px;
            text-align: right;
            font-weight: bold;
        }
        
        .bot-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            background-color: #333;
            color: #888;
        }
        
        .bot-status.running {
            background-color: #d4edda;
            color: #155724;
        }
        
        .bot-status.paused {
            background-color: #fff3cd;
            color: #856404;
        }
        
        .bot-status.stopped {
            background-color: #f8d7da;
            color: #721c24;
        }
        
        
        @keyframes alert-pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        .scenario-info {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .scenario-title {
            font-size: 18px;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 5px;
        }
        
        .scenario-message {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 10px;
        }
        
        .scenario-description {
            font-size: 12px;
            color: #999;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 5px;
            }
            
            .status-bar {
                padding: 10px;
            }
            
            .status-row {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
                margin-bottom: 15px;
                padding: 10px 0;
            }
            
            .status-row-left, .status-row-right {
                width: 100%;
            }
            
            .status-row-left {
                flex-direction: column;
                gap: 8px;
            }
            
            .fps-counter {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                font-size: 12px;
            }
            
            .image-container {
                flex-direction: column;
                gap: 15px;
            }
            
            .image-panel {
                min-width: auto;
                margin-bottom: 0;
                min-height: auto;
            }
            
            .image-wrapper {
                min-height: 250px;
            }
            
            .btn {
                width: 100%;
                margin: 0;
                padding: 12px;
                font-size: 14px;
            }
            
            .debug-image, .route-image {
                width: 100%;
                height: auto;
                image-rendering: -webkit-optimize-contrast;
                image-rendering: crisp-edges;
            }
            
            .bot-status {
                font-size: 12px;
                padding: 6px 12px;
            }
        }
        
        /* High DPI displays optimization */
        @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
            .debug-image, .route-image {
                image-rendering: -webkit-optimize-contrast;
                image-rendering: crisp-edges;
            }
        }
    </style>
</head>
<body>
    
    <div class="status-bar">
        <!-- 第一行：连接状态 + Bot状态 + 控制按钮 -->
        <div class="status-row">
            <div class="status-row-left">
                <div class="status-indicator">
                    <div id="connection-dot" class="status-dot"></div>
                    <span id="connection-status">连接中...</span>
                </div>
                <div class="bot-status" id="bot-status">
                    <span id="bot-status-icon">🤖</span>
                    <span id="bot-status-text">Bot: Unknown</span>
                    <span id="bot-state-text" style="margin-left: 10px; font-size: 12px; color: #888;">State: --</span>
                </div>
            </div>
            <div class="status-row-right">
                <button id="bot-stop-btn" class="btn btn-warning" onclick="stopBot()">⏹️ 停止Bot</button>
            </div>
        </div>
        
        <!-- 第二行：优化模式信息 -->
        <div class="status-row">
            <div class="status-row-left">
                <div id="optimization-status" style="color: #888;">🚀 优化模式: --</div>
                <div id="device-status" style="color: #888;">📱 设备: --</div>
            </div>
            <div class="status-row-right">
                <button id="toggle-opt-btn" class="btn" onclick="toggleOptimization()">🚀 切换优化模式</button>
            </div>
        </div>
        
        <!-- 第三行：性能数据 -->
        <div class="status-row">
            <div class="fps-counter">
                <span id="fps-text" class="metric">FPS: <span class="metric-number">--</span></span>
                <span id="latency-text" class="metric">延迟: <span class="metric-number">--</span>ms</span>
                <span id="encode-text" class="metric">编码: <span class="metric-number">--</span>ms</span>
                <span id="quality-text" class="metric">质量: <span class="metric-number">--</span></span>
            </div>
        </div>
    </div>
    
    <div class="scenario-info" id="scenario-info" style="display: none;">
        <div class="scenario-title" id="scenario-title">Normal Hunting</div>
        <div class="scenario-message" id="scenario-message">No rune detected</div>
        <div class="scenario-description" id="scenario-description">Testing rune alert scenarios</div>
    </div>
    
    <div class="image-container">
        <div class="image-panel">
            <h3>🎯 游戏窗口调试视图</h3>
            <div class="image-wrapper">
                <div id="debug-placeholder" class="no-image">
                    等待调试图像...
                </div>
                <img id="debug-image" class="debug-image" style="display: none;" alt="Debug Frame">
            </div>
            <div class="image-info" id="debug-info">
                状态: 未连接
            </div>
        </div>
        
        <div class="image-panel">
            <h3>🗺️ 路线地图视图</h3>
            <div class="image-wrapper">
                <div id="route-placeholder" class="no-image">
                    等待路线图像...
                </div>
                <img id="route-image" class="route-image" style="display: none;" alt="Route Frame">
            </div>
            <div class="image-info" id="route-info">
                状态: 未连接
            </div>
        </div>
    </div>
    
    <script>
        // 连接WebSocket
        const socket = io();
        
        // 检测设备类型和发送客户端信息
        function detectDevice() {
            const userAgent = navigator.userAgent;
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(userAgent);
            const devicePixelRatio = window.devicePixelRatio || 1;
            const screenWidth = window.screen.width;
            const screenHeight = window.screen.height;
            
            return {
                is_mobile: isMobile,
                device_pixel_ratio: devicePixelRatio,
                screen_width: screenWidth,
                screen_height: screenHeight,
                user_agent: userAgent,
                viewport_width: window.innerWidth,
                viewport_height: window.innerHeight
            };
        }
        
        // DOM元素
        const connectionDot = document.getElementById('connection-dot');
        const connectionStatus = document.getElementById('connection-status');
        const debugImage = document.getElementById('debug-image');
        const debugPlaceholder = document.getElementById('debug-placeholder');
        const debugInfo = document.getElementById('debug-info');
        const routeImage = document.getElementById('route-image');
        const routePlaceholder = document.getElementById('route-placeholder');
        const routeInfo = document.getElementById('route-info');
        const fpsText = document.getElementById('fps-text');
        const latencyText = document.getElementById('latency-text');
        const encodeText = document.getElementById('encode-text');
        const qualityText = document.getElementById('quality-text');
        const scenarioInfo = document.getElementById('scenario-info');
        const scenarioTitle = document.getElementById('scenario-title');
        const scenarioMessage = document.getElementById('scenario-message');
        const scenarioDescription = document.getElementById('scenario-description');
        
        // FPS计算
        let frameCount = 0;
        let lastFpsTime = Date.now();
        let fps = 0;
        
        // 连接状态处理
        socket.on('connect', function() {
            console.log('🔗 WebSocket connected');
            connectionDot.classList.add('connected');
            connectionStatus.textContent = '已连接';
            debugInfo.textContent = '状态: 已连接，等待图像...';
            routeInfo.textContent = '状态: 已连接，等待图像...';
            
            // 发送客户端设备信息以进行优化
            const deviceInfo = detectDevice();
            socket.emit('client_info', deviceInfo);
            console.log('📱 Device info sent:', deviceInfo);
            
            // 更新设备状态显示
            const deviceStatus = document.getElementById('device-status');
            deviceStatus.textContent = `📱 设备: ${deviceInfo.is_mobile ? '移动端' : '桌面端'} (${deviceInfo.screen_width}x${deviceInfo.screen_height})`;
            deviceStatus.style.color = deviceInfo.is_mobile ? '#ff9800' : '#4CAF50';
        });
        
        socket.on('disconnect', function() {
            connectionDot.classList.remove('connected');
            connectionStatus.textContent = '连接断开';
            debugInfo.textContent = '状态: 连接断开';
            routeInfo.textContent = '状态: 连接断开';
        });
        
        // 状态消息
        socket.on('status', function(data) {
            console.log('Status:', data.message);
        });
        
        // 调试图像更新
        socket.on('debug_frame_update', function(data) {
            if (data.debug_frame) {
                debugImage.src = data.debug_frame;
                debugImage.style.display = 'block';
                debugPlaceholder.style.display = 'none';
                
                const now = Date.now();
                const serverTime = data.timestamp * 1000; // Convert to milliseconds
                // 计算总延迟：包括服务端处理时间 + 网络传输时间 + WebSocket传输时间
                const totalLatency = Math.round(now - serverTime); 
                
                // 如果有服务端处理时间信息，计算网络延迟
                let networkLatency = totalLatency;
                if (data.performance && data.performance.frame_time_ms) {
                    networkLatency = Math.max(0, totalLatency - Math.round(data.performance.frame_time_ms));
                }
                
                debugInfo.textContent = `状态: 已更新 (${new Date().toLocaleTimeString()}) - 延迟: ${totalLatency}ms`;
                
                // 更新性能指标
                frameCount++;
                if (now - lastFpsTime >= 1000) {
                    fps = frameCount;
                    frameCount = 0;
                    lastFpsTime = now;
                }
                fpsText.querySelector('.metric-number').textContent = fps.toString().padStart(2, ' ');
                // 显示网络延迟，更准确反映实际网络传输延迟
                latencyText.querySelector('.metric-number').textContent = networkLatency.toString().padStart(3, ' ');
                
                // 显示编码时间和其他性能指标（如果可用）
                if (data.performance && data.performance.encode_time_ms) {
                    const encodeTime = Math.round(data.performance.encode_time_ms);
                    encodeText.querySelector('.metric-number').textContent = encodeTime.toString().padStart(2, ' ');
                }
                
                // 显示图像质量信息
                if (data.quality) {
                    qualityText.querySelector('.metric-number').textContent = data.quality.toString().padStart(3, ' ');
                }
                
                // 延迟警告 (基于网络延迟)
                if (networkLatency > 100) {
                    latencyText.style.color = '#ff4444'; // 红色表示高延迟
                } else if (networkLatency > 50) {
                    latencyText.style.color = '#ffaa00'; // 橙色表示中等延迟
                } else {
                    latencyText.style.color = '#4CAF50'; // 绿色表示低延迟
                }
            }
        });
        
        // 路线图像更新
        socket.on('route_frame_update', function(data) {
            if (data.route_frame) {
                routeImage.src = data.route_frame;
                routeImage.style.display = 'block';
                routePlaceholder.style.display = 'none';
                routeInfo.textContent = `状态: 已更新 (${new Date().toLocaleTimeString()})`;
            }
        });
        
        
        // Bot状态实时更新 - WebSocket推送
        socket.on('bot_status_update', function(data) {
            console.log('Real-time bot status update:', data);
            updateBotStatus(data.bot_status, data.bot_state);
        });
        
        
        // 错误处理
        socket.on('connect_error', function(error) {
            console.error('Connection error:', error);
            connectionStatus.textContent = '连接错误';
            connectionDot.classList.remove('connected');
        });
        
        // 图像加载错误处理
        debugImage.onerror = function() {
            debugInfo.textContent = '状态: 图像加载失败';
        };
        
        routeImage.onerror = function() {
            routeInfo.textContent = '状态: 图像加载失败';
        };
        
        
        // 切换优化模式
        async function toggleOptimization() {
            try {
                const response = await fetch('/api/toggle_optimization', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const result = await response.json();
                if (result.success) {
                    updateOptimizationStatus(result.optimized_encoding);
                    console.log('Optimization mode toggled:', result.optimized_encoding);
                } else {
                    console.error('Failed to toggle optimization:', result.error);
                }
            } catch (error) {
                console.error('Error toggling optimization:', error);
            }
        }
        
        // 更新优化状态显示
        function updateOptimizationStatus(isOptimized) {
            const optimizationStatus = document.getElementById('optimization-status');
            if (isOptimized) {
                optimizationStatus.textContent = '🚀 优化模式: 开启';
                optimizationStatus.style.color = '#4CAF50';
            } else {
                optimizationStatus.textContent = '🚀 优化模式: 关闭';
                optimizationStatus.style.color = '#888';
            }
        }
        
        // Bot控制函数
        let currentBotStatus = 'unknown';
        
        async function stopBot() {
            const botStopBtn = document.getElementById('bot-stop-btn');
            
            // 禁用按钮，防止重复点击
            botStopBtn.disabled = true;
            
            try {
                const response = await fetch('/api/bot/stop', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const result = await response.json();
                if (result.success) {
                    console.log('Bot stopped successfully');
                } else {
                    console.error('Failed to stop bot:', result.error);
                    alert('停止Bot失败: ' + result.error);
                }
                
                // 立即更新状态
                fetchServerStatus();
                
            } catch (error) {
                console.error('Error stopping bot:', error);
                alert('停止Bot时出错: ' + error.message);
            } finally {
                // 重新启用按钮
                setTimeout(() => {
                    botStopBtn.disabled = false;
                }, 1000);
            }
        }
        
        // 更新Bot状态显示
        function updateBotStatus(botStatus, botState) {
            // 避免重复更新相同状态
            if (currentBotStatus === botStatus && 
                document.getElementById('bot-state-text') && 
                document.getElementById('bot-state-text').textContent === `State: ${botState}`) {
                return;
            }
            
            currentBotStatus = botStatus;  // 更新全局状态
            
            const botStatusElement = document.getElementById('bot-status');
            const botStatusText = document.getElementById('bot-status-text');
            const botStateText = document.getElementById('bot-state-text');
            const botStopBtn = document.getElementById('bot-stop-btn');
            
            // 清除所有状态类
            if (botStatusElement) {
                botStatusElement.className = 'bot-status';
            }
            
            // 添加状态变化闪烁效果
            if (botStatusElement) {
                botStatusElement.style.transition = 'background-color 0.3s ease';
                botStatusElement.style.backgroundColor = '#444';
                setTimeout(() => {
                    botStatusElement.style.backgroundColor = '';
                }, 300);
            }
            
            // 根据状态设置样式和按钮状态
            switch (botStatus) {
                case 'running':
                    if (botStatusElement) {
                        botStatusElement.classList.add('running');
                        botStatusText.textContent = 'Bot: 运行中';
                    }
                    if (botStopBtn) {
                        botStopBtn.disabled = false;
                        botStopBtn.textContent = '⏹️ 停止Bot';
                        botStopBtn.style.opacity = '1';
                    }
                    break;
                case 'paused':
                case 'stopped':
                    if (botStatusElement) {
                        botStatusElement.classList.add('paused');
                        botStatusText.textContent = 'Bot: 已停止';
                    }
                    if (botStopBtn) {
                        botStopBtn.disabled = true;
                        botStopBtn.textContent = '⏹️ Bot已停止';
                        botStopBtn.style.opacity = '0.6';
                    }
                    break;
                default:
                    if (botStatusElement) {
                        botStatusText.textContent = 'Bot: 未知状态';
                    }
                    if (botStopBtn) {
                        botStopBtn.disabled = true;
                        botStopBtn.style.opacity = '0.6';
                    }
            }
            
            // 更新状态文本
            if (botStateText) {
                if (botState && botState !== 'unknown') {
                    botStateText.textContent = `State: ${botState}`;
                } else {
                    botStateText.textContent = 'State: --';
                }
            }
        }

        // 获取服务器状态
        async function fetchServerStatus() {
            try {
                const response = await fetch('/api/status');
                const status = await response.json();
                
                if (status.performance) {
                    updateOptimizationStatus(status.performance.optimized_encoding);
                    
                    // 显示服务器端性能信息
                    console.log('Server performance:', status.performance);
                }
                
                // 更新Bot状态
                if (status.bot_status) {
                    updateBotStatus(status.bot_status, status.bot_state);
                }
            } catch (error) {
                console.error('Error fetching server status:', error);
            }
        }
        
        // 定期获取服务器状态 - 更频繁检查bot状态变化
        setInterval(fetchServerStatus, 2000); // 每2秒检查一次
        
        // 初始化时获取状态
        fetchServerStatus();
        
        // 页面卸载时断开连接
        window.onbeforeunload = function() {
            socket.disconnect();
        };
    </script>
</body>
</html>

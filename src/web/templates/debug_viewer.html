<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapleStory Auto Bot Debug Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            color: #ffffff;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            background-color: #2a2a2a;
            border-radius: 8px;
        }
        
        .header h1 {
            margin: 0;
            color: #4CAF50;
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #2a2a2a;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ff4444;
            animation: pulse 2s infinite;
        }
        
        .status-dot.connected {
            background-color: #4CAF50;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .image-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .image-panel {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            min-width: 400px;
            flex: 1;
        }
        
        .image-panel h3 {
            margin: 0 0 15px 0;
            color: #4CAF50;
            text-align: center;
        }
        
        .image-wrapper {
            position: relative;
            text-align: center;
        }
        
        .debug-image, .route-image {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            border: 2px solid #444;
        }
        
        .no-image {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 300px;
            background-color: #333;
            border-radius: 4px;
            color: #888;
            font-style: italic;
        }
        
        .image-info {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
            text-align: center;
        }
        
        .controls {
            text-align: center;
            margin-top: 20px;
        }
        
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .btn:hover {
            background-color: #45a049;
        }
        
        .btn:disabled {
            background-color: #666;
            cursor: not-allowed;
        }
        
        .fps-counter {
            font-size: 14px;
            color: #888;
        }
        
        .alert-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        
        .alert-status.active {
            background-color: #ff4444;
            color: white;
            animation: alert-pulse 1s infinite;
        }
        
        .alert-status.inactive {
            background-color: #333;
            color: #888;
        }
        
        @keyframes alert-pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        .scenario-info {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .scenario-title {
            font-size: 18px;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 5px;
        }
        
        .scenario-message {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 10px;
        }
        
        .scenario-description {
            font-size: 12px;
            color: #888;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .image-container {
                flex-direction: column;
            }
            
            .image-panel {
                min-width: auto;
                margin-bottom: 15px;
            }
            
            .status-bar {
                flex-wrap: wrap;
                gap: 10px;
            }
            
            .fps-counter {
                display: flex;
                flex-wrap: wrap;
                gap: 5px;
                font-size: 11px;
            }
            
            .controls {
                display: flex;
                flex-wrap: wrap;
                gap: 5px;
            }
            
            .debug-image, .route-image {
                max-width: 100%;
                height: auto;
                /* Ensure high-quality scaling on mobile */
                image-rendering: -webkit-optimize-contrast;
                image-rendering: crisp-edges;
            }
        }
        
        /* High DPI displays optimization */
        @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
            .debug-image, .route-image {
                image-rendering: -webkit-optimize-contrast;
                image-rendering: crisp-edges;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎮 MapleStory Auto Bot Debug Viewer</h1>
    </div>
    
    <div class="status-bar">
        <div class="status-indicator">
            <div id="connection-dot" class="status-dot"></div>
            <span id="connection-status">连接中...</span>
        </div>
        <div class="alert-status inactive" id="alert-status">
            <span id="alert-icon">🔇</span>
            <span id="alert-text">Alert: Disabled</span>
        </div>
        <div class="fps-counter">
            <span id="fps-text">FPS: --</span>
            <span id="latency-text" style="margin-left: 10px; color: #888;">延迟: --ms</span>
            <span id="encode-text" style="margin-left: 10px; color: #888;">编码: --ms</span>
            <span id="quality-text" style="margin-left: 10px; color: #888;">质量: --</span>
        </div>
        <div class="controls">
            <button id="refresh-btn" class="btn" onclick="location.reload()">刷新页面</button>
            <button id="test-sound-btn" class="btn" onclick="testAudio()">测试音频</button>
            <button id="toggle-opt-btn" class="btn" onclick="toggleOptimization()">切换优化模式</button>
            <div id="audio-status" style="display: inline-block; margin-left: 10px; font-size: 12px; color: #888;">
                🔇 音频未激活
            </div>
            <div id="optimization-status" style="display: inline-block; margin-left: 10px; font-size: 12px; color: #888;">
                🚀 优化模式: --
            </div>
            <div id="device-status" style="display: inline-block; margin-left: 10px; font-size: 12px; color: #888;">
                📱 设备: --
            </div>
        </div>
    </div>
    
    <div class="scenario-info" id="scenario-info" style="display: none;">
        <div class="scenario-title" id="scenario-title">Normal Hunting</div>
        <div class="scenario-message" id="scenario-message">No rune detected</div>
        <div class="scenario-description" id="scenario-description">Testing rune alert scenarios</div>
    </div>
    
    <div class="image-container">
        <div class="image-panel">
            <h3>🎯 游戏窗口调试视图</h3>
            <div class="image-wrapper">
                <div id="debug-placeholder" class="no-image">
                    等待调试图像...
                </div>
                <img id="debug-image" class="debug-image" style="display: none;" alt="Debug Frame">
            </div>
            <div class="image-info" id="debug-info">
                状态: 未连接
            </div>
        </div>
        
        <div class="image-panel">
            <h3>🗺️ 路线地图视图</h3>
            <div class="image-wrapper">
                <div id="route-placeholder" class="no-image">
                    等待路线图像...
                </div>
                <img id="route-image" class="route-image" style="display: none;" alt="Route Frame">
            </div>
            <div class="image-info" id="route-info">
                状态: 未连接
            </div>
        </div>
    </div>
    
    <script>
        // 连接WebSocket
        const socket = io();
        
        // 检测设备类型和发送客户端信息
        function detectDevice() {
            const userAgent = navigator.userAgent;
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(userAgent);
            const devicePixelRatio = window.devicePixelRatio || 1;
            const screenWidth = window.screen.width;
            const screenHeight = window.screen.height;
            
            return {
                is_mobile: isMobile,
                device_pixel_ratio: devicePixelRatio,
                screen_width: screenWidth,
                screen_height: screenHeight,
                user_agent: userAgent,
                viewport_width: window.innerWidth,
                viewport_height: window.innerHeight
            };
        }
        
        // DOM元素
        const connectionDot = document.getElementById('connection-dot');
        const connectionStatus = document.getElementById('connection-status');
        const debugImage = document.getElementById('debug-image');
        const debugPlaceholder = document.getElementById('debug-placeholder');
        const debugInfo = document.getElementById('debug-info');
        const routeImage = document.getElementById('route-image');
        const routePlaceholder = document.getElementById('route-placeholder');
        const routeInfo = document.getElementById('route-info');
        const fpsText = document.getElementById('fps-text');
        const latencyText = document.getElementById('latency-text');
        const encodeText = document.getElementById('encode-text');
        const qualityText = document.getElementById('quality-text');
        const alertStatus = document.getElementById('alert-status');
        const alertIcon = document.getElementById('alert-icon');
        const alertText = document.getElementById('alert-text');
        const scenarioInfo = document.getElementById('scenario-info');
        const scenarioTitle = document.getElementById('scenario-title');
        const scenarioMessage = document.getElementById('scenario-message');
        const scenarioDescription = document.getElementById('scenario-description');
        
        // FPS计算
        let frameCount = 0;
        let lastFpsTime = Date.now();
        let fps = 0;
        
        // 连接状态处理
        socket.on('connect', function() {
            console.log('🔗 WebSocket connected');
            connectionDot.classList.add('connected');
            connectionStatus.textContent = '已连接';
            debugInfo.textContent = '状态: 已连接，等待图像...';
            routeInfo.textContent = '状态: 已连接，等待图像...';
            
            // 发送客户端设备信息以进行优化
            const deviceInfo = detectDevice();
            socket.emit('client_info', deviceInfo);
            console.log('📱 Device info sent:', deviceInfo);
            
            // 更新设备状态显示
            const deviceStatus = document.getElementById('device-status');
            deviceStatus.textContent = `📱 设备: ${deviceInfo.is_mobile ? '移动端' : '桌面端'} (${deviceInfo.screen_width}x${deviceInfo.screen_height})`;
            deviceStatus.style.color = deviceInfo.is_mobile ? '#ff9800' : '#4CAF50';
        });
        
        socket.on('disconnect', function() {
            connectionDot.classList.remove('connected');
            connectionStatus.textContent = '连接断开';
            debugInfo.textContent = '状态: 连接断开';
            routeInfo.textContent = '状态: 连接断开';
        });
        
        // 状态消息
        socket.on('status', function(data) {
            console.log('Status:', data.message);
        });
        
        // 调试图像更新
        socket.on('debug_frame_update', function(data) {
            if (data.debug_frame) {
                debugImage.src = data.debug_frame;
                debugImage.style.display = 'block';
                debugPlaceholder.style.display = 'none';
                
                const now = Date.now();
                const serverTime = data.timestamp * 1000; // Convert to milliseconds
                const latency = now - serverTime;
                
                debugInfo.textContent = `状态: 已更新 (${new Date().toLocaleTimeString()}) - 延迟: ${latency}ms`;
                
                // 更新性能指标
                frameCount++;
                if (now - lastFpsTime >= 1000) {
                    fps = frameCount;
                    frameCount = 0;
                    lastFpsTime = now;
                }
                fpsText.textContent = `FPS: ${fps}`;
                latencyText.textContent = `延迟: ${latency}ms`;
                
                // 显示编码时间和其他性能指标（如果可用）
                if (data.performance && data.performance.encode_time_ms) {
                    encodeText.textContent = `编码: ${data.performance.encode_time_ms}ms`;
                }
                
                // 显示图像质量信息
                if (data.quality) {
                    qualityText.textContent = `质量: ${data.quality}%`;
                }
                
                // 延迟警告
                if (latency > 200) {
                    latencyText.style.color = '#ff4444'; // 红色表示高延迟
                } else if (latency > 100) {
                    latencyText.style.color = '#ffaa00'; // 橙色表示中等延迟
                } else {
                    latencyText.style.color = '#4CAF50'; // 绿色表示低延迟
                }
            }
        });
        
        // 路线图像更新
        socket.on('route_frame_update', function(data) {
            if (data.route_frame) {
                routeImage.src = data.route_frame;
                routeImage.style.display = 'block';
                routePlaceholder.style.display = 'none';
                routeInfo.textContent = `状态: 已更新 (${new Date().toLocaleTimeString()})`;
            }
        });
        
        // 告警状态更新
        socket.on('alert_status_update', function(data) {
            if (data.alert_active) {
                alertStatus.className = 'alert-status active';
                alertIcon.textContent = '🔊';
                alertText.textContent = 'Alert: Active';
            } else {
                alertStatus.className = 'alert-status inactive';
                alertIcon.textContent = '🔇';
                alertText.textContent = 'Alert: Disabled';
            }
        });
        
        // 声音命令处理
        socket.on('sound_command', function(data) {
            console.log('🎵 Sound command received:', data.command);
            console.log('🎵 Command data:', data);
            playSound(data.command);
        });
        
        // 声音播放函数
        function playSound(command) {
            console.log('Playing sound command:', command);
            
            switch(command) {
                case 'start_rune_alert':
                    playRuneAlert();
                    console.log('Started rune alert sound');
                    break;
                case 'stop_rune_alert':
                    stopRuneAlert();
                    console.log('Stopped rune alert sound');
                    break;
                case 'play_rune_solved_alert':
                    playRuneSolved();
                    console.log('Played rune solved sound');
                    break;
                case 'play_bot_stopped_alert':
                    playBotStopped();
                    console.log('Played bot stopped sound');
                    break;
                default:
                    console.warn('Unknown sound command:', command);
            }
        }
        
        // 音频文件路径
        const AUDIO_FILES = {
            'rune_alert': '/media/rune_alert.wav',
            'rune_solved': '/media/rune_solved.wav',
            'bot_stopped': '/media/bot_stopped.wav'
        };
        
        // 预加载音频文件
        const audioElements = {};
        let audioContext = null;
        let userInteracted = false;
        
        // 初始化音频
        function initAudio() {
            for (const [key, path] of Object.entries(AUDIO_FILES)) {
                audioElements[key] = new Audio(path);
                audioElements[key].preload = 'auto';
                audioElements[key].volume = 0.7; // 设置音量
            }
            
            // 创建音频上下文
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                console.log('Audio context created');
            } catch (error) {
                console.error('Failed to create audio context:', error);
            }
        }
        
        // 用户交互处理
        function handleUserInteraction() {
            if (!userInteracted) {
                userInteracted = true;
                console.log('User interaction detected, audio enabled');
                
                // 更新音频状态显示
                const audioStatus = document.getElementById('audio-status');
                if (audioStatus) {
                    audioStatus.innerHTML = '🔊 音频已激活';
                    audioStatus.style.color = '#4CAF50';
                }
                
                // 恢复音频上下文
                if (audioContext && audioContext.state === 'suspended') {
                    audioContext.resume().then(() => {
                        console.log('Audio context resumed');
                    });
                }
                
                // 预播放一个静音音频来激活音频权限
                const silentAudio = new Audio();
                silentAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
                silentAudio.play().catch(() => {
                    // 忽略错误，这只是为了激活音频权限
                });
            }
        }
        
        // 监听用户交互事件
        document.addEventListener('click', handleUserInteraction);
        document.addEventListener('keydown', handleUserInteraction);
        document.addEventListener('touchstart', handleUserInteraction);
        
        // 初始化音频
        initAudio();
        
        // 符文告警声音（循环播放）
        let runeAlertInterval = null;
        
        function playRuneAlert() {
            // 检查用户交互
            if (!userInteracted) {
                console.warn('User interaction required before playing audio');
                return;
            }
            
            // 停止之前的告警
            stopRuneAlert();
            
            // 创建循环播放
            runeAlertInterval = setInterval(() => {
                if (audioElements.rune_alert) {
                    audioElements.rune_alert.currentTime = 0;
                    audioElements.rune_alert.play().catch(error => {
                        console.error('Error playing rune alert:', error);
                        if (error.name === 'NotAllowedError') {
                            console.warn('Audio playback blocked. Please interact with the page first.');
                        }
                    });
                }
            }, 1000); // 每秒播放一次
        }
        
        function stopRuneAlert() {
            if (runeAlertInterval) {
                clearInterval(runeAlertInterval);
                runeAlertInterval = null;
            }
            // 停止当前播放的音频
            if (audioElements.rune_alert) {
                audioElements.rune_alert.pause();
                audioElements.rune_alert.currentTime = 0;
            }
        }
        
        // 符文解决声音
        function playRuneSolved() {
            // 检查用户交互
            if (!userInteracted) {
                console.warn('User interaction required before playing audio');
                return;
            }
            
            if (audioElements.rune_solved) {
                audioElements.rune_solved.currentTime = 0;
                audioElements.rune_solved.play().catch(error => {
                    console.error('Error playing rune solved:', error);
                    if (error.name === 'NotAllowedError') {
                        console.warn('Audio playback blocked. Please interact with the page first.');
                    }
                });
            }
        }
        
        // 机器人停止声音
        function playBotStopped() {
            // 检查用户交互
            if (!userInteracted) {
                console.warn('User interaction required before playing audio');
                return;
            }
            
            if (audioElements.bot_stopped) {
                audioElements.bot_stopped.currentTime = 0;
                audioElements.bot_stopped.play().catch(error => {
                    console.error('Error playing bot stopped:', error);
                    if (error.name === 'NotAllowedError') {
                        console.warn('Audio playback blocked. Please interact with the page first.');
                    }
                });
            }
        }
        
        // 错误处理
        socket.on('connect_error', function(error) {
            console.error('Connection error:', error);
            connectionStatus.textContent = '连接错误';
            connectionDot.classList.remove('connected');
        });
        
        // 图像加载错误处理
        debugImage.onerror = function() {
            debugInfo.textContent = '状态: 图像加载失败';
        };
        
        routeImage.onerror = function() {
            routeInfo.textContent = '状态: 图像加载失败';
        };
        
        // 音频测试函数
        function testAudio() {
            console.log('Testing audio...');
            
            // 强制触发用户交互
            handleUserInteraction();
            
            // 等待一小段时间确保音频上下文恢复
            setTimeout(() => {
                // 测试符文告警声音
                playRuneAlert();
                setTimeout(() => {
                    stopRuneAlert();
                    console.log('Audio test completed');
                }, 3000);
            }, 100);
        }
        
        // 切换优化模式
        async function toggleOptimization() {
            try {
                const response = await fetch('/api/toggle_optimization', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const result = await response.json();
                if (result.success) {
                    updateOptimizationStatus(result.optimized_encoding);
                    console.log('Optimization mode toggled:', result.optimized_encoding);
                } else {
                    console.error('Failed to toggle optimization:', result.error);
                }
            } catch (error) {
                console.error('Error toggling optimization:', error);
            }
        }
        
        // 更新优化状态显示
        function updateOptimizationStatus(isOptimized) {
            const optimizationStatus = document.getElementById('optimization-status');
            if (isOptimized) {
                optimizationStatus.textContent = '🚀 优化模式: 开启';
                optimizationStatus.style.color = '#4CAF50';
            } else {
                optimizationStatus.textContent = '🚀 优化模式: 关闭';
                optimizationStatus.style.color = '#888';
            }
        }
        
        // 获取服务器状态
        async function fetchServerStatus() {
            try {
                const response = await fetch('/api/status');
                const status = await response.json();
                
                if (status.performance) {
                    updateOptimizationStatus(status.performance.optimized_encoding);
                    
                    // 显示服务器端性能信息
                    console.log('Server performance:', status.performance);
                }
            } catch (error) {
                console.error('Error fetching server status:', error);
            }
        }
        
        // 定期获取服务器状态
        setInterval(fetchServerStatus, 5000);
        
        // 初始化时获取状态
        fetchServerStatus();
        
        // 页面卸载时断开连接
        window.onbeforeunload = function() {
            socket.disconnect();
        };
    </script>
</body>
</html>
